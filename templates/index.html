<!DOCTYPE html>
<html>
<head>
    <title>Stock Sentiment Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>📊 Stock Sentiment Chatbot</h1>

<form method="POST">
    <input type="text" name="stock" placeholder="Enter stock name..." required>
    <button type="submit">Analyze</button>
</form>

{% if sentiment %}
    <h2>Stock: {{ stock }}</h2>
    <h3>Sentiment: {{ sentiment }}</h3>
    <p>Score: {{ score }}</p>

    <h3>Latest News:</h3>
    <ul>
        {% for n in news %}
            <li>{{ n }}</li>
        {% endfor %}
    </ul>
{% endif %}

</body>
</html>
