<!DOCTYPE html>
<html>
<head>
    <title>Stock Sentiment Chatbot</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>📊 Stock Sentiment Chatbot</h1>

    <!-- Input Form -->
    <form method="POST">
        <input type="text" name="stock" placeholder="Enter stock name (e.g. TCS, Tesla)" required>
        <button type="submit">Analyze</button>
    </form>

    <!-- Result Section -->
    {% if sentiment %}
    <div class="card">

        <h2>{{ stock }}</h2>

        <!-- Sentiment -->
        <h3 class="sentiment {{ sentiment|lower }}">
            {{ sentiment }}
        </h3>

        <p>Score: {{ score }}</p>

        <!-- News -->
        <h3>📰 Latest News</h3>
        <ul>
            {% for n in news %}
                <li>{{ n }}</li>
            {% endfor %}
        </ul>

        <!-- 🔥 GRAPH SECTION (IMPORTANT) -->
        {% if graph %}
            <h3>📈 Stock Price Graph</h3>
            <img src="{{ graph }}" width="80%" style="border-radius: 15px; margin-top: 10px;">
        {% endif %}

    </div>
    {% endif %}

</div>

</body>
</html>
